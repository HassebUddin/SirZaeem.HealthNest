services:
  - type: web
    name: healthnest-api
    runtime: docker
    dockerfilePath: ./backend/HealthNest.Api/Dockerfile
    dockerContext: ./backend/HealthNest.Api
    plan: free
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: healthnest-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: healthnest-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: healthnest-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: healthnest-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: healthnest-db
          property: password
      - key: Jwt__Issuer
        value: SirZaeem.HealthNest
      - key: Jwt__Audience
        value: SirZaeem.HealthNest.Client
      - key: Jwt__Key
        generateValue: true
      - key: AllowedOrigins__0
        sync: false
      - key: Gemini__ApiKey
        sync: false
      - key: ASPNETCORE_ENVIRONMENT
        value: Production

databases:
  - name: healthnest-db
    plan: free
    databaseName: healthnestdb
    user: healthnest
